<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار السلوك التنظيمي وعلم النفس الصناعي والقيادة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: linear-gradient(45deg, #ff7675, #fdcb6e, #00cec9, #6c5ce7);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-top: 110px;
        }

        /* شريط النتيجة الثابت في الأعلى بتصميم زجاجي */
        .score-board {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .counters-container {
            display: flex;
            gap: 30px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .score-item.correct-count { color: #34d399; }
        .score-item.wrong-count { color: #f87171; }

        /* ستايل اسم Moza المتوهج */
        .user-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .user-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: tagShine 3.5s infinite linear;
        }

        @keyframes tagShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .user-tag-name {
            background: var(--accent-glow);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: tagGradientText 3s infinite linear;
            font-family: 'Arial Black', Gadget, sans-serif;
            letter-spacing: 1px;
        }

        @keyframes tagGradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fire-icon {
            animation: pulseFire 1.5s ease-in-out infinite;
        }

        @keyframes pulseFire {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #ff7675); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 8px #ff7675); }
        }

        /* ستايل نافذة الترحيب المنبثقة */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .welcome-popup {
            background: #1e1b4b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(99, 102, 241, 0.2);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .welcome-popup h2 {
            font-size: 2.8rem;
            background: var(--accent-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px 0;
            font-family: 'Arial Black', sans-serif;
        }

        .welcome-popup p {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .start-btn {
            background: linear-gradient(45deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.7);
        }

        .welcome-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 35px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        header p {
            color: #a855f7;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0;
        }

        .section-title {
            background: linear-gradient(90deg, #312e81, transparent);
            color: #e2e8f0;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 50px;
            margin-bottom: 25px;
            font-size: 1.4rem;
            border-right: 5px solid #6366f1;
        }

        .question-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            color: #cbd5e1;
            cursor: pointer;
            text-align: right;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
            color: #ffffff;
            transform: translateX(-3px);
        }

        .option-btn.correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .option-btn.wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* صندوق التعليل والتصحيح */
        .correction-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.9);
            border-right: 4px solid #6366f1;
            border-radius: 6px;
            font-size: 1rem;
            color: #e2e8f0;
            display: none;
            line-height: 1.6;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .correction-box.show-info {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tf-container {
            display: flex;
            gap: 15px;
        }

        .tf-container .option-btn {
            text-align: center;
            font-weight: bold;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.75;
        }

        .footer-admin-card {
            margin-top: 70px;
            margin-bottom: 40px;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .footer-admin-text {
            color: #e2e8f0;
            font-size: 1.15rem;
            margin: 0;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .footer-admin-name {
            background: var(--accent-glow);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 1.6rem;
            text-transform: uppercase;
            animation: gradientText 3s infinite linear;
            display: inline-block;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .crown-icon {
            font-size: 1.5rem;
            animation: floatIcon 2s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px) scale(1.1); }
        }
    </style>
</head>
<body>

<div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-popup">
        <h2>Welcome!</h2>
        <p>جاهز للاختبار الجديد يا <strong>طالب</strong>؟</p>
        <button class="start-btn" onclick="closeWelcome()">ابدأ الاختبار الآن</button>
    </div>
</div>

<div class="score-board">
    <div class="counters-container">
        <div class="score-item correct-count">الإجابات الصحيحة: <span id="correct-score">0</span></div>
        <div class="score-item wrong-count">عدد الأخطاء (كام غلطة): <span id="wrong-score">0</span></div>
    </div>
    
    <div class="user-tag">
        <span class="user-tag-name">Moza</span>
        <span class="fire-icon">🔥</span>
    </div>
</div>

<div class="container">
    <header>
        <h1>الاختبار وبنك الأسئلة للمراجعة</h1>
        <p>السلوك التنظيمي، علم النفس الصناعي، والقيادة</p>
    </header>

    <h2 class="section-title">القسم الأول: أسئلة الصح والخطأ</h2>
    <div id="true-false-section"></div>

    <h2 class="section-title">القسم الثاني: أسئلة الاختيار من متعدد</h2>
    <div id="multiple-choice-section"></div>

    <div class="footer-admin-card">
        <p class="footer-admin-text">
            <span class="crown-icon">👑</span>
            تحت إشراف أدمن الجروب:
            <span class="footer-admin-name">Moza</span>
        </p>
    </div>
</div>

<script>
    function closeWelcome() {
        document.getElementById('welcomeOverlay').classList.add('hidden');
    }

    let totalCorrect = 0;
    let totalWrong = 0;

    function updateScoreBoard() {
        document.getElementById('correct-score').innerText = totalCorrect;
        document.getElementById('wrong-score').innerText = totalWrong;
    }

    const tfQuestions = [
        { id: 1, text: "ليس هناك ضرورة كبيرة لتحليل ودراسة السلوك الإنساني.", ans: 0, correction: "لأن السلوك الإنساني سلوك معقد؛ لأن جزءاً منه يكون ظاهراً وقابلاً للملاحظة وجزءاً آخر يكون غير ظاهر ولا يمكن قياسه بشكل واضح ومباشر، ولذلك فمن الضروري تحليل ودراسة السلوك التنظيمي." },
        { id: 2, text: "السلوك الإنساني يقصد به كافة التصرفات والأفعال التي تصدر من الفرد.", ans: 1 },
        { id: 3, text: "دراسة المدير لسلوك المرؤوسين لا تساعده في فهم السلوك الشاذ الذي يسود بعض العاملين.", ans: 0, correction: "دراسة المدير لسلوك مرؤوسيه تقربه من فهم دوافعهم، وتمكنه من أن يستخدم مهارة أساليب التحفيز المناسبة لهم، ورفع روحهم المعنوية، والتعرف على السلوك الشاذ الذي يسود بعض العاملين مثل كثرة الغياب والعدوان والتمرد على العمل، والتعرف على دوافع السلوك الشاذ وتقديم سبل العلاج بدلاً من العقاب." },
        { id: 4, text: "تهدف دراسة السلوك التنظيمي إلى فهم الأبعاد النفسية والسلوكية والاجتماعية للإنسان بصفة عامة في المنظمة.", ans: 1 },
        { id: 5, text: "Sلوك التنظيمي يعد دعامة أساسية لنجاح أي منظمة.", ans: 1 },
        { id: 6, text: "علم النفس الصناعي هو أحد فروع علم النفس إذ يغلب عليه الجانب التطبيقي.", ans: 1 },
        { id: 7, text: "علم النفس الصناعي لا يفيد في الوقوف على مشكلات العاملين ورفع الروح المعنوية.", ans: 0, correction: "يهدف علم النفس الصناعي إلى رفع الكفاية الإنتاجية للعاملين وذلك عن طريق حل المشكلات التي تحدث في المجال الصناعي حلاً علمياً إنسانياً، كما يحرص على كرامة واحترام العاملين بما يحقق لهم الراحة النفسية والصحية التي تساهم في زيادة الإنتاج كماً ونوعاً." },
        { id: 8, text: "من أهداف علم النفس الصناعي زيادة توافق العامل مع عمله.", ans: 1 },
        { id: 9, text: "الهندسة البشرية ليست فرعاً حديثاً من فروع علم النفس الصناعي.", ans: 0, correction: "تعتبر الهندسة البشرية فرعاً حديثاً من فروع علم النفس الصناعي، ويقصد به تصميم أو تعديل الآلة بما يتناسب والاستعدادات النفسية لمن يعمل عليها من البشر." },
        { id: 10, text: "علم النفس الصناعي لا يُعنى في المقام الأول بتوجيه الفرد للعمل الذي يتواءم مع قدراته وينسجم مع بنائه النفسي.", ans: 0, correction: "من أهمية علم النفس الصناعي أنه يُعنى في المقام الأول بتوجيه الإنسان للعمل الذي يتواءم مع قدراته وينسجم مع بنائه النفسي." },
        { id: 11, text: "البيئة ليس لها دور في تكوين الشخصية.", ans: 0, correction: "البيئة لها دور مهم في التعلم وتكوين الشخصية." },
        { id: 12, text: "نظرية السمات تهتم بالفروق الفردية بين الأفراد.", ans: 1 },
        { id: 13, text: "السمات الثانوية تظهر في كل المواقف.", ans: 0, correction: "تظهر في مواقف معينة." },
        { id: 14, text: "مفهوم الذات يؤثر على دافعية الفرد للعمل.", ans: 1 },
        { id: 15, text: "الشخصية بالكامل تتغير من يوم لآخر.", ans: 0, correction: "الشخصية ثابتة نسبياً وليست متغيرة بالكامل." },
        { id: 16, text: "الدوافع هي قوة خارجية فقط تؤثر على سلوك الفرد.", ans: 0, correction: "القوة قد تكون داخلية أو خارجية." },
        { id: 17, text: "حسب نظرية ماسلو لا يمكن الانتقال لمستوى أعلى قبل إشباع المستوى الأدنى.", ans: 1 },
        { id: 18, text: "زيادة المرتب دائماً تؤدي إلى تحفيز قوي طويل الأمد.", ans: 0, correction: "طبقاً لنظرية هرزبرج المرتب عامل صحي (وقائي) يمنع الاستياء ولكنه لا يخلق دافعية قوية طويلة الأمد." },
        { id: 19, text: "دافع الإنجاز من أهم دوافع نظرية ميكليلاند.", ans: 1 },
        { id: 20, text: "الحب والانتماء تعتبر من حاجات التقدير.", ans: 0, correction: "هي من الحاجات الاجتماعية." },
        { id: 21, text: "القيم تساعد في توجيه سلوك الأفراد داخل المجتمع.", ans: 1 },
        { id: 22, text: "القيم لا تؤثر في اتخاذ القرارات.", ans: 0, correction: "القيم تؤثر في عملية اتخاذ القرارات للمديرين." },
        { id: 23, text: "ضعف التربية الأسرية قد يؤدي إلى تدهور القيم في المجتمع.", ans: 1 },
        { id: 24, text: "القيم تساعد في زيادة الاستقرار في المجتمع.", ans: 1 },
        { id: 25, text: "القيم الاقتصادية تهتم بالجمال والتنظيم.", ans: 0, correction: "تهتم بالربح والمنفعة المادية." },
        { id: 26, text: "الاتجاهات السلبية يمكن تغييرها من خلال التدريب والتطوير.", ans: 1 },
        { id: 27, text: "الاتجاهات السلبية لا تؤثر على العمل الجماعي في المنظمة.", ans: 0, correction: "الاتجاهات السلبية قد تؤدي إلى صراعات بين الأفراد وتقلل من العمل الجماعي وبالتالي تؤثر بالسلب على الإنتاجية والأداء العام." },
        { id: 28, text: "الاتجاهات الإيجابية تجاه العمل تعزز من الإنتاجية والرضا الوظيفي.", ans: 1 },
        { id: 29, text: "كل الأفراد في المنظمة يتشاركون نفس القيم والاتجاهات.", ans: 0, correction: "في أي منظمة يوجد تنوع كبير في القيم والاتجاهات بين الأفراد بناءً على خلفياتهم الثقافية والتجارب الشخصية." },
        { id: 30, text: "اتجاهات الأفراد يمكن أن تتأثر بالبيئة الخارجية فقط وليس بالبيئة الداخلية بالمنظمة.", ans: 0, correction: "الاتجاهات تتأثر بكل من البيئة الداخلية مثل (ثقافة المنظمة – أسلوب الإدارة – العلاقات الشخصية) والبيئة الخارجية مثل التغيرات (الاقتصادية – السياسية – الاجتماعية)." },
        { id: 31, text: "المعلومات الجيدة تساعد في اتخاذ قرارات أفضل.", ans: 1 },
        { id: 32, text: "لا تؤثر الحالة النفسية على القرار.", ans: 0, correction: "الحالة النفسية لها دور مهم في عملية اتخاذ القرارات." },
        { id: 33, text: "الخبرة ليس لها علاقة باتخاذ القرار.", ans: 0, correction: "تلعب الخبرة دوراً كبيراً في عملية اتخاذ القرارات." },
        { id: 34, text: "من سلبيات المشاركة زيادة الصراعات بين الأفراد.", ans: 1 },
        { id: 35, text: "المشاركة تقلل من قبول العاملين للقرار.", ans: 0, correction: "المشاركة تزيد من قبول العاملين للقرار." },
        { id: 36, text: "القرارات الاستراتيجية تتخذها الإدارة العليا.", ans: 1 },
        { id: 37, text: "تعدد الآراء يساعد على تحسين القرارات.", ans: 1 },
        { id: 38, text: "العوامل البيئية لا تؤثر على المنظمة.", ans: 0, correction: "تلعب العوامل البيئية مثل (الظروف الاقتصادية - المنافسة - التكنولوجيا - القوانين الحكومية) دوراً مهماً في حياة المنظمة." },
        { id: 39, text: "القرارات الفردية دائماً أفضل من الجماعية.", ans: 0, correction: "ليست دائماً أفضل، وقد تكون الجماعية أدق وأكثر حكمة." },
        { id: 40, text: "المشاركة تؤدي إلى سرعة اتخاذ القرار دائماً.", ans: 0, correction: "تؤدي غالباً إلى بطء اتخاذ القرار نتيجة النقاشات والمشاورات." },

        { id: 60, text: "الهدف الأساسي من التحفيز هو:", options: ["أ- تقليل الإنتاج", "ب– تقليل الرواتب", "ج- زيادة سلوك العاملين الإيجابي وتحسين الأداء", "د- إنهاء العمل"], ans: 2 },
        { id: 61, text: "من أنواع التحفيز:", options: ["أ- مادية ومعنوية", "ب– داخلية فقط", "ج- خارجية فقط", "د- إدارية فقط"], ans: 0 },
        { id: 62, text: "من أمثلة الحوافز المادية:", options: ["أ- التقدير", "ب– المكافآت المالية", "ج- الاحترام", "د- التشجيع"], ans: 1 },
        { id: 63, text: "من أهداف التحفيز:", options: ["أ- رفع كفاءة الأداء", "ب– تقليل رضا العاملين", "ج- زيادة الغياب", "د- إضعاف الإنتاج"], ans: 0 },
        { id: 64, text: "التحفيز الفعال يؤدي في النهاية إلى:", options: ["أ- انخفاض الإنتاج", "ب– توقف العمل", "ج- إلغاء الأهداف", "د- زيادة الرضا الوظيفي والإنتاجية"], ans: 3 }
    ];

    function renderTrueFalseQuestions() {
        const container = document.getElementById('true-false-section');
        let html = '';
        
        tfQuestions.forEach((q, index) => {
            html += `
                <div class="question-card" id="tf-card-${q.id}">
                    <div class="question-text">${index + 1}. ${q.text}</div>
                    <div class="options-container tf-container">
                        <button class="option-btn" onclick="checkTrueFalse(${q.id}, 1, this)">صح</button>
                        <button class="option-btn" onclick="checkTrueFalse(${q.id}, 0, this)">خطأ</button>
                    </div>
                    ${q.correction ? `<div class="correction-box" id="correction-${q.id}"><strong>التصحيح العلمي:</strong> ${q.correction}</div>` : ''}
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderMultipleChoiceQuestions() {
        const container = document.getElementById('multiple-choice-section');
        let html = '';
        
        mcQuestions.forEach((q, index) => {
            html += `
                <div class="question-card" id="mc-card-${q.id}">
                    <div class="question-text">${index + 1}. ${q.text}</div>
                    <div class="options-container">
            `;
            
            q.options.forEach((opt, optIndex) => {
                html += `
                    <button class="option-btn" onclick="checkMultipleChoice(${q.id}, ${optIndex}, this)">${opt}</button>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function checkTrueFalse(qId, userAns, btn) {
        const q = tfQuestions.find(item => item.id === qId);
        const card = document.getElementById(`tf-card-${qId}`);
        const buttons = card.querySelectorAll('.option-btn');
        
        buttons.forEach(b => b.classList.add('disabled'));
        
        if (userAns === q.ans) {
            btn.classList.add('correct');
            totalCorrect++;
        } else {
            btn.classList.add('wrong');
            totalWrong++;
            buttons.forEach(b => {
                const isTrueBtn = b.innerText === 'صح';
                if ((q.ans === 1 && isTrueBtn) || (q.ans === 0 && !isTrueBtn)) {
                    b.classList.add('correct');
                }
            });
        }
        
        // إظهار التصحيح دائماً عند الإجابة على السؤال لمعرفة التعليل العلمي (سواء أجاب صح أو خطأ) إذا كان متوفراً
        const corrBox = document.getElementById(`correction-${qId}`);
        if (corrBox) {
            corrBox.classList.add('show-info');
        }
        
        updateScoreBoard();
    }

    function checkMultipleChoice(qId, userAnsIndex, btn) {
        const q = mcQuestions.find(item => item.id === qId);
        const card = document.getElementById(`mc-card-${qId}`);
        const buttons = card.querySelectorAll('.option-btn');
        
        buttons.forEach(b => b.classList.add('disabled'));
        
        if (userAnsIndex === q.ans) {
            btn.classList.add('correct');
            totalCorrect++;
        } else {
            btn.classList.add('wrong');
            totalWrong++;
            buttons[q.ans].classList.add('correct');
        }
        updateScoreBoard();
    }

    window.onload = function() {
        renderTrueFalseQuestions();
        renderMultipleChoiceQuestions();
    };
</script>

</body>
</html>
